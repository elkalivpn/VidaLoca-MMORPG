services:
  postgres:
    image: postgres:16-alpine
    container_name: vidaloca-postgres
    environment:
      POSTGRES_USER: vidaloca
      POSTGRES_PASSWORD: vidaloca
      POSTGRES_DB: vidaloca
    ports:
      - "5432:5432"
    volumes:
      - vidaloca_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vidaloca"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: vidaloca-redis
    ports:
      - "6379:6379"
    volumes:
      - vidaloca_redis:/data

volumes:
  vidaloca_pgdata:
  vidaloca_redis:
